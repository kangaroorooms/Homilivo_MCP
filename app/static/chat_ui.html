<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homilivo Room Search - Demo</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-dark: #2255c4;
    --user-bubble: #2f6fed;
    --user-bubble-text: #ffffff;
    --bot-bubble: #eef0f4;
    --bot-bubble-text: #1f2430;
    --error: #b3261e;
    --error-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  .app {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .header-controls input[type="password"] {
    width: 180px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
  }
  select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    background: white;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    padding: 7px 12px;
    font-weight: 500;
  }
  #resetBtn {
    background: white;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #resetBtn:hover { background: var(--bg); }
  .demo-badge {
    font-size: 11px;
    font-weight: 600;
    color: #1a7f4b;
    background: #e6f6ee;
    border: 1px solid #b7e4cc;
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .conn-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--muted);
    white-space: nowrap;
  }
  .conn-badge.live { color: #1a7f4b; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--bot-bubble);
    color: var(--bot-bubble-text);
    border-bottom-left-radius: 4px;
  }
  .row.assistant .bubble.error {
    background: var(--error-bg);
    color: var(--error);
  }
  .row.assistant .bubble.typing {
    color: var(--muted);
    font-style: italic;
  }

  .rooms {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
    max-width: 78%;
  }
  .room-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: white;
    font-size: 13px;
  }
  .room-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .room-card .room-title {
    font-weight: 600;
    margin-bottom: 2px;
  }
  .room-card .room-meta {
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .room-card .room-price {
    color: var(--accent-dark);
    font-weight: 600;
  }
  .selected-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--accent-dark);
    background: #e8effe;
    border-radius: 999px;
    padding: 1px 8px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .room-amenities {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .amenity-chip {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .no-results {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #messageInput {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  #messageInput:focus { border-color: var(--accent); }
  #sendBtn {
    background: var(--accent);
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
  }
  #sendBtn:disabled { background: #a9c0f5; cursor: not-allowed; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    padding: 0 20px 10px;
  }

  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    #messages { padding: 14px; }
    form#composer { padding: 10px 14px; }
    .hint { padding: 0 14px 8px; }
    .bubble, .rooms { max-width: 92%; }
    .header-controls input[type="password"] { width: 130px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Homilivo Room Search — Demo</h1>
      <div class="subtitle">Browser → FastAPI /chat → guardrails → agent engine → MCP → Homilivo API</div>
    </div>
    <div class="header-controls">
      <span id="connBadge" class="conn-badge">○ REST</span>
      <span id="demoBadge" class="demo-badge" hidden>Server credential active</span>
      <input id="tokenInput" type="password" placeholder="Homilivo API token" autocomplete="off">
      <select id="modeSelect" title="Response mode">
        <option value="fast" selected>fast</option>
        <option value="qwen">qwen</option>
        <option value="gemma">gemma</option>
        <option value="groq">groq</option>
      </select>
      <button id="resetBtn" type="button">Clear / Reset</button>
    </div>
  </header>

  <div id="messages"></div>
  <div class="hint" id="tokenHint">
    Token is kept only in this page's memory for this tab — never saved, never sent anywhere except the
    Authorization header of your own requests to this server.
  </div>

  <form id="composer">
    <input id="messageInput" type="text" maxlength="500" autocomplete="off"
           placeholder="e.g. Find rooms in Jaipur" required>
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  // Per-tab conversation state, kept only in JS variables (page memory).
  // No localStorage / sessionStorage / cookies are used for the token or
  // the session id, matching the demo-safety requirement.
  let sessionId = null;

  // Opaque, short-lived demo credential (see app/demo_auth.py). This is
  // NEVER the real Homilivo token - it only works because the server
  // recognizes it and substitutes its own server-side credential. When
  // no server-side credential is configured, this stays null and the
  // page falls back to the manual token field exactly as before.
  let demoToken = null;

  const messagesEl = document.getElementById("messages");
  const composerEl = document.getElementById("composer");
  const inputEl = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const tokenEl = document.getElementById("tokenInput");
  const modeEl = document.getElementById("modeSelect");
  const resetBtn = document.getElementById("resetBtn");
  const demoBadgeEl = document.getElementById("demoBadge");
  const tokenHintEl = document.getElementById("tokenHint");
  const connBadgeEl = document.getElementById("connBadge");

  async function tryEnableDemoCredential() {
    try {
      const response = await fetch("/chat-ui/demo-token");
      if (!response.ok) return; // 404 = no server credential configured; use manual entry.

      const data = await response.json();
      if (!data || !data.token) return;

      demoToken = data.token;
      tokenEl.hidden = true;
      tokenEl.required = false;
      demoBadgeEl.hidden = false;
      tokenHintEl.textContent =
        "This server has a demo credential configured, so no token entry is needed here. " +
        "The real Homilivo credential never reaches this page.";
    } catch (err) {
      // Network hiccup fetching the demo-token endpoint; fall back to
      // manual entry, same as if the endpoint were simply unavailable.
    }
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendMessage(role, text, isError) {
    const row = document.createElement("div");
    row.className = "row " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error" : "");
    bubble.textContent = text;

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function appendTyping() {
    const row = document.createElement("div");
    row.className = "row assistant";
    row.dataset.typing = "true";

    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.textContent = "Assistant is typing...";

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function formatPrice(value) {
    if (value === null || value === undefined) return null;
    try {
      return "₹" + Number(value).toLocaleString("en-IN") + "/month";
    } catch (err) {
      return String(value);
    }
  }

  function renderRooms(rooms, selectedRoom, searchWasPerformed) {
    if (!rooms || rooms.length === 0) {
      if (searchWasPerformed) renderNoResults();
      return;
    }

    const container = document.createElement("div");
    container.className = "rooms";

    rooms.forEach(function (room) {
      const card = document.createElement("div");
      const isSelected = selectedRoom && selectedRoom.id === room.id;
      card.className = "room-card" + (isSelected ? " selected" : "");

      const title = document.createElement("div");
      title.className = "room-title";
      title.textContent = room.title || "Untitled room";
      if (isSelected) {
        const tag = document.createElement("span");
        tag.className = "selected-tag";
        tag.textContent = "SELECTED";
        title.appendChild(tag);
      }

      const meta = document.createElement("div");
      meta.className = "room-meta";

      const location = [room.location, room.city].filter(Boolean).join(", ");
      if (location) {
        const locEl = document.createElement("span");
        locEl.textContent = location;
        meta.appendChild(locEl);
      }

      if (room.room_type) {
        const typeEl = document.createElement("span");
        typeEl.textContent = room.room_type;
        meta.appendChild(typeEl);
      }

      const price = formatPrice(room.price_per_month);
      if (price) {
        const priceEl = document.createElement("span");
        priceEl.className = "room-price";
        priceEl.textContent = price;
        meta.appendChild(priceEl);
      }

      card.appendChild(title);
      card.appendChild(meta);

      if (room.amenities && room.amenities.length > 0) {
        const amenitiesEl = document.createElement("div");
        amenitiesEl.className = "room-amenities";
        room.amenities.forEach(function (amenity) {
          const chip = document.createElement("span");
          chip.className = "amenity-chip";
          chip.textContent = amenity;
          amenitiesEl.appendChild(chip);
        });
        card.appendChild(amenitiesEl);
      }

      container.appendChild(card);
    });

    const row = document.createElement("div");
    row.className = "row assistant";
    row.appendChild(container);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function renderNoResults() {
    const row = document.createElement("div");
    row.className = "row assistant";

    const empty = document.createElement("div");
    empty.className = "no-results";
    empty.textContent = "No matching rooms found. Try a different city, budget, or room type.";

    row.appendChild(empty);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function setLoading(isLoading) {
    sendBtn.disabled = isLoading;
    inputEl.disabled = isLoading;
  }

  function setConnBadge(state) {
    // state: "live" (WebSocket streaming), "rest" (fallback), "connecting"
    if (state === "live") {
      connBadgeEl.textContent = "● live";
      connBadgeEl.className = "conn-badge live";
    } else if (state === "connecting") {
      connBadgeEl.textContent = "… connecting";
      connBadgeEl.className = "conn-badge";
    } else {
      connBadgeEl.textContent = "○ REST";
      connBadgeEl.className = "conn-badge";
    }
  }

  // --------------------------------------------------------
  // REST fallback (also the initial path until/unless a WebSocket
  // connection is confirmed working - see sendMessage below).
  // --------------------------------------------------------

  async function sendViaRest(text, token) {
    const typingRow = appendTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({
          message: text,
          session_id: sessionId,
          mode: modeEl.value,
        }),
      });

      typingRow.remove();

      if (!response.ok) {
        let detail = response.statusText;
        try {
          const errorBody = await response.json();
          if (errorBody && errorBody.detail) {
            detail = typeof errorBody.detail === "string"
              ? errorBody.detail
              : JSON.stringify(errorBody.detail);
          }
        } catch (parseError) {
          // Non-JSON error body; fall back to statusText already set above.
        }
        appendMessage("assistant", "Error (" + response.status + "): " + detail, true);
        return;
      }

      const data = await response.json();
      sessionId = data.session_id;

      appendMessage("assistant", data.message);
      renderRooms(data.rooms, data.selected_room, data.search_performed);
    } catch (networkError) {
      typingRow.remove();
      appendMessage("assistant", "Could not reach the server. Please check your connection and try again.", true);
    }
  }

  // --------------------------------------------------------
  // WebSocket streaming, with REST as the fallback whenever a
  // connection cannot be opened or drops. Reconnect is attempted
  // lazily on the next message rather than eagerly in the background,
  // keeping the demo simple while still recovering automatically.
  // --------------------------------------------------------

  let socket = null;
  let socketToken = null;
  let turnTypingRow = null;
  let turnBubbleRow = null;
  let turnSettle = null; // resolves the in-flight sendViaSocket() promise

  function wsUrlFor(token) {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + location.host + "/ws/chat?token=" + encodeURIComponent(token);
  }

  function openSocket(token) {
    return new Promise(function (resolve, reject) {
      let settled = false;
      let ws;
      try {
        ws = new WebSocket(wsUrlFor(token));
      } catch (err) {
        reject(err);
        return;
      }

      const timeoutId = setTimeout(function () {
        if (settled) return;
        settled = true;
        try { ws.close(); } catch (err) { /* ignore */ }
        reject(new Error("WebSocket connect timeout"));
      }, 4000);

      ws.addEventListener("open", function () {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        resolve(ws);
      });

      ws.addEventListener("error", function () {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        reject(new Error("WebSocket connection failed"));
      });

      ws.addEventListener("close", function () {
        if (socket === ws) {
          socket = null;
          setConnBadge("rest");
        }
        // A turn that was mid-flight when the socket dropped must not
        // hang forever waiting for a "done"/"error" that will never
        // arrive.
        if (turnSettle) {
          const settleFn = turnSettle;
          turnSettle = null;
          settleFn(false);
        }
      });

      ws.addEventListener("message", handleSocketMessage);
    });
  }

  async function ensureSocket(token) {
    if (socket && socket.readyState === WebSocket.OPEN && socketToken === token) {
      return socket;
    }
    if (socket) {
      try { socket.close(); } catch (err) { /* ignore */ }
      socket = null;
    }
    setConnBadge("connecting");
    socket = await openSocket(token);
    socketToken = token;
    setConnBadge("live");
    return socket;
  }

  function handleSocketMessage(event) {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (err) {
      return;
    }

    if (data.event === "ping") return;

    if (data.event === "typing") {
      turnTypingRow = appendTyping();
      return;
    }

    if (data.event === "token") {
      if (turnTypingRow) { turnTypingRow.remove(); turnTypingRow = null; }
      if (!turnBubbleRow) turnBubbleRow = appendMessage("assistant", "");
      turnBubbleRow.querySelector(".bubble").textContent += data.text;
      scrollToBottom();
      return;
    }

    if (data.event === "done") {
      if (turnTypingRow) { turnTypingRow.remove(); turnTypingRow = null; }
      if (turnBubbleRow) {
        turnBubbleRow.querySelector(".bubble").textContent = data.message;
      } else {
        appendMessage("assistant", data.message);
      }
      turnBubbleRow = null;
      sessionId = data.session_id;
      renderRooms(data.rooms, data.selected_room, data.search_performed);
      if (turnSettle) { const fn = turnSettle; turnSettle = null; fn(true); }
      return;
    }

    if (data.event === "error") {
      if (turnTypingRow) { turnTypingRow.remove(); turnTypingRow = null; }
      turnBubbleRow = null;
      appendMessage("assistant", data.detail || "Something went wrong.", true);
      if (turnSettle) { const fn = turnSettle; turnSettle = null; fn(true); }
      return;
    }
  }

  function sendViaSocket(ws, text) {
    return new Promise(function (resolve) {
      turnSettle = resolve;
      try {
        ws.send(JSON.stringify({ message: text, session_id: sessionId, mode: modeEl.value }));
      } catch (err) {
        turnSettle = null;
        resolve(false);
      }
    });
  }

  async function sendMessage(text) {
    const token = demoToken || tokenEl.value.trim();

    if (!token) {
      appendMessage("assistant", "Please enter your Homilivo API token above first.", true);
      return;
    }

    appendMessage("user", text);
    setLoading(true);

    try {
      let ws = null;
      try {
        ws = await ensureSocket(token);
      } catch (err) {
        ws = null;
      }

      if (ws) {
        const handled = await sendViaSocket(ws, text);
        if (!handled) {
          // The socket dropped mid-turn; fall back to REST for this
          // message so the user still gets an answer.
          await sendViaRest(text, token);
        }
      } else {
        await sendViaRest(text, token);
      }
    } finally {
      setLoading(false);
    }
  }

  composerEl.addEventListener("submit", function (event) {
    event.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    sendMessage(text);
  });

  resetBtn.addEventListener("click", async function () {
    if (sessionId) {
      try {
        await fetch("/chat/reset?session_id=" + encodeURIComponent(sessionId), {
          method: "POST",
        });
      } catch (err) {
        // Best-effort server-side cleanup; clear the UI regardless.
      }
    }
    sessionId = null;
    messagesEl.innerHTML = "";
    appendMessage("assistant", "Conversation cleared. Ask me to find rooms whenever you're ready.");
  });

  appendMessage(
    "assistant",
    "Hi! I'm the Homilivo room-search assistant. Enter your API token above, then try: " +
    "\"Find rooms in Jaipur\"."
  );

  tryEnableDemoCredential();
})();
</script>
</body>
</html>
