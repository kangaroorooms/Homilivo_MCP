name: CI

# Runs the full test suite + the golden-eval gates on every PR and on
# every push to main. Nothing here talks to Ollama or the live Homilivo
# API - tests/conftest.py mocks the outbound Homilivo HTTP call, and the
# LLM (Gemma/Qwen/Groq) paths are mocked wherever they're exercised. The
# only outbound network calls this job makes are pip installs and the
# one-time sentence-transformers model download (cached below), both of
# which the existing test suite already depends on locally.
#
# NOTE for repo admins: this job (job id "test") should be added as a
# required status check in GitHub branch protection for `main`, so a PR
# that fails pytest or drops below a golden-eval gate cannot be merged.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff (if configured)
        run: |
          if [ -f pyproject.toml ] && grep -q "\[tool.ruff\]" pyproject.toml; then
            pip install ruff
            ruff check .
          elif [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            pip install ruff
            ruff check .
          else
            echo "No ruff configuration found in this repo yet; skipping lint step."
          fi

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run golden-set eval gate
        run: python tests/run_golden_eval.py
